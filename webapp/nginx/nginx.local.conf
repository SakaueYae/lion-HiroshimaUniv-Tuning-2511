user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;  # 24から大幅増加（ベンチマーク用）
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  # アップストリーム（同一ネットワーク内なので ports: 不要）
  upstream fe { 
    server frontend:3000;
    keepalive 32;  # キープアライブ接続を維持
  }
  upstream be { 
    server backend:8080;
    keepalive 64;  # バックエンドへの接続を再利用（重要）
  }
  upstream jaeger {
    server jaeger:16686;
    keepalive 16;
  }

  server {
    listen 80;

    # ヘルスチェック
    location = /health-check { 
        return 200 "ok\n";
        add_header Content-Type text/plain;
        }

    # APIはバックエンドへ
    location /api/ {
      proxy_pass         http://be;
      proxy_http_version 1.1;                          # HTTP/1.1でキープアライブ有効化
      proxy_set_header   Connection "";                # キープアライブ用
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      
      # バッファ設定（大きなレスポンス対応）
      proxy_buffering    on;
      proxy_buffer_size  8k;
      proxy_buffers      8 8k;
    }

    location /jaeger/ {
      proxy_pass         http://jaeger;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # それ以外はフロントへ
    location / {
      proxy_pass         http://fe;
      proxy_set_header   Host $host;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
    }

  }
}